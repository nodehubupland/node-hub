name: Node Hub Badge Update

on:
  push:
    paths:
      - '.nodehub-badge-update'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update verified badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '<span class="verified-badge">Verified Node</span>'
          new = '<span class="verified-badge" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--accent-light);font-weight:800;">✓ Verified Node</span>'
          if old not in s:
              raise SystemExit('Target badge markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Improve verified node badge"
          git push
