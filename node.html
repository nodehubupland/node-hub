<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node | Node Hub</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:#f5f5f5}.container{max-width:1000px;margin:auto;padding:40px 20px}.back{display:inline-block;margin-bottom:30px;color:#f39a32;text-decoration:none}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:30px}.logo{width:100%;height:280px;display:flex;align-items:center;justify-content:center;background:#0f0f0f;border-radius:14px;margin-bottom:25px}.logo img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{font-size:60px;color:#555}.eyebrow{font-size:12px;letter-spacing:2px;color:#f39a32}.verified{display:inline-block;margin:10px 0;padding:6px 10px;border-radius:20px;background:#17351f;color:#75d48a;font-size:13px}.meta{color:#bbb}.description{line-height:1.7;color:#ddd}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.links a{padding:11px 16px;border-radius:8px;background:#f39a32;color:#111;text-decoration:none;font-weight:bold}.error{text-align:center;padding:60px 20px}</style>
</head>
<body>
<div class="container">
<a class="back" href="./#nodes">← Back to Nodes</a>
<div id="app"><div class="error">Loading Node...</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ynqtzyzxspoxssjrjeve.supabase.co";
const SUPABASE_KEY="sb_publishable_FoDbr9qgVeeIYfzEZNNN9N_53aHxI2g";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function safe(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
async function load(){
 const id=new URLSearchParams(location.search).get('id');
 const name=new URLSearchParams(location.search).get('name');
 if(!id&&!name){document.getElementById('app').innerHTML='<div class="error"><h2>Node not found</h2><p>No Node identifier was provided.</p></div>';return}
 let q=db.from('nodes').select('*').eq('status','approved');
 q=id?q.eq('id',id).maybeSingle():q.eq('name',name).maybeSingle();
 const {data,error}=await q;
 if(error||!data){document.getElementById('app').innerHTML='<div class="error"><h2>Node not found</h2><p>This Node may not be approved or may no longer exist.</p></div>';return}
 document.title=`${data.name||'Node'} | Node Hub`;
 const links=[];
 if(data.discord_url)links.push(`<a href="${safe(data.discord_url)}" target="_blank" rel="noopener noreferrer">Discord</a>`);
 if(data.twitter_url)links.push(`<a href="${safe(data.twitter_url)}" target="_blank" rel="noopener noreferrer">X / Twitter</a>`);
 if(data.telegram_url)links.push(`<a href="${safe(data.telegram_url)}" target="_blank" rel="noopener noreferrer">Telegram</a>`);
 const logo=data.logo_url?`<img src="${safe(data.logo_url)}" alt="${esc(data.name)}">`:'<div class="placeholder">●</div>';
 document.getElementById('app').innerHTML=`<article class="card"><div class="logo">${logo}</div><span class="eyebrow">UPLAND COMMUNITY</span><h1>${esc(data.name||'Unnamed Node')}</h1><span class="verified">✓ Verified Node</span><p class="meta">${esc(data.city||'')}${data.country?', '+esc(data.country):''}</p>${data.upland_location?`<p class="meta"><strong>Neighborhood:</strong> ${esc(data.upland_location)}</p>`:''}${data.continent?`<p class="meta"><strong>Continent:</strong> ${esc(data.continent)}</p>`:''}${data.description?`<p class="description">${esc(data.description)}</p>`:''}${links.length?`<div class="links">${links.join('')}</div>`:''}</article>`;
}
load();
</script>
</body>
</html>
