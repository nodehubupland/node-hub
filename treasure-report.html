<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Treasure Report | Node Hub</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css">
<style>
.treasure-report{max-width:980px;margin:0 auto;padding:42px 20px 80px}.tr-head{text-align:center;margin-bottom:28px}.tr-head .eyebrow{display:block}.tr-account{font-weight:700;margin-top:12px}.tr-status{opacity:.75}.tr-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}.tr-tabs button{border:1px solid var(--border);background:var(--bg-card);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer}.tr-tabs button.active{border-color:var(--accent-light);color:var(--accent-light)}.tr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.tr-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}.tr-card span{display:block;opacity:.65;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.tr-card strong{display:block;font-size:26px;margin-top:7px}.tr-section{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:18px}.tr-table{width:100%;border-collapse:collapse}.tr-table th,.tr-table td{padding:11px 8px;border-bottom:1px solid var(--border);text-align:left}.tr-empty{text-align:center;opacity:.7;padding:28px}.tr-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}@media(max-width:760px){.tr-grid{grid-template-columns:repeat(2,1fr)}.tr-table{font-size:13px}.tr-table th:nth-child(4),.tr-table td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="treasure-report">
<div class="tr-head"><span class="eyebrow">MY TREASURE REPORT</span><h1 id="tr-title">Loading...</h1><p id="tr-status" class="tr-status">Checking your Upland connection...</p></div>
<div class="tr-tabs" id="tr-tabs"><button data-period="24h" class="active">24H</button><button data-period="48h">48H</button><button data-period="7d">7D</button><button data-period="30d">30D</button></div>
<div class="tr-grid"><div class="tr-card"><span>Treasures</span><strong id="tr-treasures">0</strong></div><div class="tr-card"><span>UPX Total</span><strong id="tr-upx">0</strong></div><div class="tr-card"><span>Average</span><strong id="tr-avg">0</strong></div><div class="tr-card"><span>Sparklets</span><strong id="tr-spark">0</strong></div></div>
<div class="tr-grid"><div class="tr-card"><span>Best Reward</span><strong id="tr-best">0</strong></div><div class="tr-card"><span>Last Treasure</span><strong id="tr-last">—</strong></div></div>
<div class="tr-section"><h2>Treasure History</h2><div id="tr-history" class="tr-empty">Loading...</div></div>
<div class="tr-section"><h2>By City</h2><div id="tr-cities" class="tr-empty">Loading...</div></div>
<div class="tr-actions"><a class="button button-secondary" href="./index.html#dashboard">Back to Dashboard</a><a class="button button-primary" href="./index.html#home">Node Hub Home</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260829-treasure"></script>
<script src="treasure-report.js?v=20260829-v1"></script>
</body></html>
