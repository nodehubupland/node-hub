name: Install Upland connection frontend

on:
  push:
    paths:
      - upland-connect.js
      - .github/workflows/install-upland-connect.yml

permissions:
  contents: write

jobs:
  install-upland-connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Upland connection script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <script src="upland-connect.js?v=20260825-v1"></script>\n'
          if 'src="upland-connect.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit frontend update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Load Upland account connection"
            git push
          fi

# Triggered after initial workflow creation to install the V1 connection script.
