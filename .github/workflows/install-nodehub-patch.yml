name: Install Node Hub frontend patch

on:
  push:
    paths:
      - nodehub-patch.js
      - .github/workflows/install-nodehub-patch.yml

permissions:
  contents: write

jobs:
  install-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install patch script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <script src="nodehub-patch.js"></script>\n'

          if 'src="nodehub-patch.js"' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit frontend update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Load Node Hub frontend patch"
            git push
          fi
