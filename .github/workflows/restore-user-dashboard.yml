name: Keep current user dashboard loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure current user dashboard loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          s, count = re.subn(r'<script src="user-dashboard\.js\?v=[^"]+"></script>', '<script src="user-dashboard.js?v=20260828-v5"></script>', s, count=1)
          if count == 0:
              marker = '<script src="app.js?v=20260824-v4"></script>'
              loader = marker + '<script src="user-dashboard.js?v=20260828-v5"></script>'
              if marker not in s:
                  raise SystemExit('app.js script marker not found')
              s = s.replace(marker, loader, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit loader change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Use refreshed user dashboard loader'
          git push
