name: Fix Node profile presentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Node card and profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('alt="${escapeHTML(node.name || "Node")}" loading="lazy"', 'alt="" aria-hidden="true" loading="lazy"'),
              ('alt="${escapeHTML(node.name)}" style="width:100%;max-height:220px;object-fit:contain;"', 'alt="" aria-hidden="true" style="display:block;width:100%;max-height:220px;object-fit:contain;margin:0 auto;"'),
              ('alt="${escapeHTML(node.name)}" style="max-width:280px;max-height:280px;object-fit:contain;margin:0 auto 24px;"', 'alt="" aria-hidden="true" style="display:block;width:min(280px,100%);max-width:280px;height:auto;max-height:280px;object-fit:contain;margin:0 auto 24px;"'),
              ('<div class="container"><div class="auth-card" style="text-align:center;">', '<div class="container"><div class="auth-card" style="text-align:center;max-width:900px;margin-left:auto;margin-right:auto;">'),
              ('<div class="node-links">\n                ${node.discord_url', '<div class="node-links" style="justify-content:center;">\n                ${node.discord_url'),
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          if not changed:
              raise SystemExit('No expected Node profile patterns were found. Nothing was changed.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/fix-node-profile.yml
          git commit -m "Fix Node card and public profile alignment"
          git push
