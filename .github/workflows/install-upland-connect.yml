name: Install Upland connection frontend

on:
  push:
    paths:
      - upland-connect.js
      - admin-upland.js
      - .github/workflows/install-upland-connect.yml

permissions:
  contents: write

jobs:
  install-upland-connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Upland connection controls
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          tag = '    <script src="upland-connect.js?v=20260827-v4"></script>\n'
          if 'src="upland-connect.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace(marker, tag + marker, 1)
              index.write_text(text, encoding="utf-8")

          admin = Path("admin.html")
          text = admin.read_text(encoding="utf-8")
          card = '<div id="admin-upland-account" class="auth-card" style="margin-top:24px;"><span class="eyebrow">UPLAND ACCOUNT</span><h2 style="margin-top:8px">Connect Upland Account</h2><p>Authorize your Upland account with Node Hub to enable Upland API features.</p></div>'
          marker_card = '<div class="auth-card" style="margin-top:24px;"><span class="eyebrow">ACCOUNT</span>'
          if 'id="admin-upland-account"' not in text:
              if marker_card not in text:
                  raise SystemExit("Could not find Admin ACCOUNT card marker")
              text = text.replace(marker_card, card + marker_card, 1)
          tag = '    <script src="admin-upland.js?v=20260827-v1"></script>\n'
          if 'src="admin-upland.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit("Could not find </body> in admin.html")
              text = text.replace(marker, tag + marker, 1)
          admin.write_text(text, encoding="utf-8")
          PY

      - name: Commit frontend update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add Upland connection control to admin"
            git push
          fi

# Installs the Upland connection control on both the user and admin dashboards.
