name: Restore Node Hub Directory Site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore existing Node Hub site at /
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'discord-bot/index.js';
          let s = fs.readFileSync(file, 'utf8');
          if (!s.includes('const LANDING_PAGE = `')) throw new Error('Expected landing page block was not found');
          const start = s.indexOf('const LANDING_PAGE = `');
          const route = s.indexOf("server.get('/',", start);
          if (route === -1) throw new Error('Root route was not found');
          const end = s.indexOf("server.get('/health'", route);
          if (end === -1) throw new Error('Health route was not found');
          const replacement = `server.use(require('express').static(require('path').join(__dirname, '..')));\n\nserver.get('/', (_req, res) => res.sendFile(require('path').join(__dirname, '..', 'index.html')));\n`;
          s = s.slice(0, start) + replacement + s.slice(end);
          fs.writeFileSync(file, s);
          NODE

      - name: Commit restored site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-bot/index.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Node Hub directory site"
          git push
