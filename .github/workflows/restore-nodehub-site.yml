name: Validate Node Hub Directory Site

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Node Hub site files
        run: |
          test -f index.html
          test -f app.js
          test -f user-dashboard.js
          test -f upland-connect.js
          grep -q 'server.get('\''/'\''' discord-bot/index.js
          grep -q 'express.static' discord-bot/index.js
          echo "Node Hub site structure is valid."
