<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node Hub | Reset Password</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="v1-compact.css?v=20260824-v3">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="./#home" class="logo"><span class="logo-dot">●</span> NODE HUB</a></div></header>
<main>
<section class="section section-alt"><div class="container"><div class="auth-container"><div class="auth-card">
<span class="eyebrow">NODE HUB ACCOUNT</span>
<h1>Reset Password</h1>
<p id="reset-message">Enter your new password below.</p>
<form id="reset-form">
<label for="new-password">New password</label>
<input type="password" id="new-password" minlength="8" required placeholder="Minimum 8 characters">
<label for="confirm-password">Confirm password</label>
<input type="password" id="confirm-password" minlength="8" required placeholder="Repeat your new password">
<button type="submit" class="button button-primary">Update Password</button>
</form>
<div id="reset-result" style="margin-top:16px;"></div>
<div style="margin-top:20px;"><a href="./#login">Back to Sign in</a></div>
</div></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ynqtzyzxspoxssjrjeve.supabase.co";
const SUPABASE_KEY="sb_publishable_FoDbr9qgVeeIYfzEZNNN9Q_53aHxI2g";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('reset-form');
const message=document.getElementById('reset-message');
const result=document.getElementById('reset-result');
async function init(){
  const hash=window.location.hash;
  if(hash.includes('access_token=')){try{await db.auth.exchangeCodeForSession(new URLSearchParams(hash.substring(1)).get('code'));}catch(e){}}
  const {data}=await db.auth.getSession();
  if(!data.session){message.textContent='This password reset link is invalid or has expired. Request a new one from the Sign in page.';form.style.display='none';}
}
form.addEventListener('submit',async e=>{
 e.preventDefault(); result.textContent='';
 const p=document.getElementById('new-password').value;
 const c=document.getElementById('confirm-password').value;
 if(p.length<8){result.textContent='Password must contain at least 8 characters.';return;}
 if(p!==c){result.textContent='Passwords do not match.';return;}
 const {error}=await db.auth.updateUser({password:p});
 if(error){result.textContent=error.message;return;}
 result.textContent='Password updated successfully. You can now sign in with your new password.';
 form.style.display='none';
});
window.addEventListener('load',init);
</script>
<script src="v1-language.js?v=20260824"></script>
</body>
</html>
